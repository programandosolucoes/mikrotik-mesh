[workspace]
resolver = "2"
members = [
    "crates/mkt-proto",
    "crates/mkt-crypto",
    "crates/mkt-net",
    "crates/mkt-core",
    "crates/mkt-php",
    "crates/mkt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Carlos <developer@antigravity.ai>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/carlos/mikrotik-mesh"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
byteorder = "1.5"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
curve25519-dalek = { version = "4.1", features = ["rand_core"] }
rand = "0.8"
socket2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
chacha20poly1305 = "0.10"

